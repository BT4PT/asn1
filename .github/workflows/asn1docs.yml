name: "ASN.1 Documentation"
on:
  push:
    branches:
      - root
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/TheEnbyperor/asn1docs
      - name: Find ASN.1 source files
        uses: tj-actions/glob@v22
        id: glob
        with:
          files: |
            asn1/*.asn
            old-asn1/*.asn
            examples/*.asn
      - name: Build ASN.1 Docs
        run: python3 -m asn1docs -o docs_out/ ${{ steps.glob.outputs.paths }}
      - name: Upload docs as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs_out/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4